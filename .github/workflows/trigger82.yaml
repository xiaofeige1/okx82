name: okx82

on:
  repository_dispatch:
    types: [trigger_okx82]  # 外部定时器触发的事件名称
  workflow_dispatch:        # 保留手动触发按钮

# 开启并发锁，同一时间只允许一个任务进行 push，避免并发冲突
concurrency:
  group: okx82-push-group
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # 获取完整 Git 历史，确保 rebase 顺利进行

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Run Screener
        run: node okx853.js
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL || 'onboarding@resend.dev' }}

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add result.json
          if ! git diff --cached --quiet; then
            git commit -m "update result"
            git pull --rebase origin main
            git push origin main
          fi
